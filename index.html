<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoiseLab</title>
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<style>
  body { margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }

  /* Top title bar */
  #titlebar {
    height: 50px;
    background: #333;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 15px;
    font-size: 1.2em;
    flex-shrink: 0;
    user-select: none;
  }
  #titlebar span { margin-left: 10px; }
  #titlebar img { height: 30px; }

  /* Main content area */
  #content {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* Left panel (graph) */
  #graph-container {
    flex: 1;
    background: #111;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Right panel (final canvas) */
  #canvas-container {
    width: 400px;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-left: 2px solid #444;
  }

  /* LiteGraph canvas fills left panel */
  #graph { width: 100%; height: 100%; display: block; }

  /* Final noise canvas */
  #noiseCanvas { border: 1px solid #555; }


    /* Checkbox*/
    .checkbox-container { margin-left: auto;}

    .checkbox-container {
        display: block;
        position: relative;
        padding-left: 45px;
        cursor: pointer;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    /* Hide the browser's default checkbox */
    .checkbox-container input {
        position: absolute;
        opacity: 0;
        cursor: pointer;
        height: 0;
        width: 0;
    }

    /* Create a custom checkbox */
    .checkmark {
        position: absolute;
        top: 0;
        left: 0;
        height: 20px;
        width: 20px;
        background-color: #eee;
    }

    /* On mouse-over, add a grey background color */
    .checkbox-container:hover input ~ .checkmark {
        background-color: #ccc;
    }

    /* When the checkbox is checked, add a blue background */
    .checkbox-container input:checked ~ .checkmark {
        background-color: #B16F8F;
    }

    /* Create the checkmark/indicator (hidden when not checked) */
    .checkmark:after {
        content: "";
        position: absolute;
        display: none;
    }

    /* Show the checkmark when checked */
    .checkbox-container input:checked ~ .checkmark:after {
        display: block;
    }

    /* Style the checkmark/indicator */
    .checkbox-container .checkmark:after {
        left: 6px;
        top: 2px;
        width: 5px;
        height: 10px;
        border: solid white;
        border-width: 0 3px 3px 0;
        -webkit-transform: rotate(45deg);
        -ms-transform: rotate(45deg);
        transform: rotate(45deg);
    }
</style>
</head>
<body>

<div id="titlebar">
  <img src="img/icon.png">
  <span>NoiseLab</span>

  <label class="checkbox-container">Terrain mode
    <input type="checkbox" checked="checked" id="terrain-mode">
    <span class="checkmark"></span>
  </label>
</div>

<div id="content">
  <div id="graph-container">
    <canvas id="graph"></canvas>
  </div>
  <div id="canvas-container">
    <canvas id="noiseCanvas" width="256" height="256"></canvas>
  </div>
</div>

<!-- LiteGraph -->
<link rel="stylesheet" href="css/external/litegraph.css">

<!-- Simplex Noise -->
<script src="js/external/simplex.js"></script>
<script src="js/external/perlin.js"></script>
<script src="js/external/litegraph.js"></script>
<script src="js/utils.js"></script>
<script src="js/nodes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
