<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NoiseLab - Free Online Graph Noise Editor | Perlin | Simplex | Voronoi</title>
  <meta name="description" content="NoiseLab is a free web graph-based noise editor for creating procedural textures and generative content. Explore, and experiment with noise functions.">
  <meta name="keywords" content="noise editor, procedural textures, graph editor, perlin noise, simplex noise, voronoi noise, generative art, web-based editor">
  <meta name="author" content="Daniel Armesto">

  <meta name="google-site-verification" content="Tdi4ds4wGpTJVlhqQGM6AjeJpwYXXpbjp45eaX-C9eQ" />

  <!-- JSON-LD structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "NoiseLab",
    "url": "https://xdargu.github.io/NoiseLab/",
    "description": "Web-based graph editor for creating procedural textures, terrains, and generative content.",
    "applicationCategory": "DesignApplication",
    "operatingSystem": "Web",
    "author": {
      "@type": "Person",
      "name": "Daniel Armesto"
    }
  }
  </script>

  <!-- Open Graph for social sharing -->
  <meta property="og:title" content="NoiseLab - Free Online Graph Noise Editor">
  <meta property="og:description" content="Create procedural textures and generative content online with NoiseLab, the web-based graph editor.">
  <meta property="og:image" content="https://xdargu.github.io/NoiseLab/img/og_image.png">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NoiseLab - Free Online Graph Noise Editor">
  <meta name="twitter:description" content="Create procedural textures and generative content online with NoiseLab.">
  <meta name="twitter:image" content="https://xdargu.github.io/NoiseLab/img/og_image.png">

  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="css/noiselab.css">
</head>
<body>

<!-- Wrap everything under a main container -->
<main id="main-container" style="display:flex; flex:1; height:100vh; overflow:hidden;">

  <!-- Graph library sidebar -->
  <aside id="graph-sidebar">
    <div id="sidetitle">
      <img src="img/complete-logo.png" alt="noiselab and logo">
    </div>
    <button id="createGraphBtn"><i class="fas fa-plus"></i> Create New Graph</button>
    
    <input type="text" id="graphSearch" placeholder="Search your graphs...">

    <h4 class="section-title">Your Graphs</h4>
    <div id="yourGraphsSection">
      <ul id="yourGraphsList"></ul>
    </div>

    <div id="noiseLabInfo">
        <div>NoiseLab is a free online graph-based noise and image editing tool.</div>
        <div class="line"><a href="https://www.danielarmesto.com" target="_blank">Made by Daniel Armesto</a></div>
    </div>
  </aside>

  <!-- Main editor area -->
  <section id="editor-area" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
    <div id="titlebar">
      <span id="currentGraphName" contenteditable="true">Untitled</span>
      
      <button id="exportBtn"><i class="fas fa-file-export"></i> Export</button>
      <button id="importBtn"><i class="fas fa-file-import"></i> Import</button>
      
      <label class="checkbox-container">Terrain mode
        <input type="checkbox" checked="checked" id="terrain-mode">
        <span class="checkmark"></span>
      </label>
    </div>

    <div id="content" style="flex:1; display:flex; overflow:hidden;">
      <div id="graph-container" style="flex:1; background:#111; display:flex; flex-direction:column; overflow:hidden;">
        <canvas id="graph"></canvas>
      </div>
      <div id="canvas-container">
        <canvas id="noiseCanvas" width="256" height="256"></canvas>
      </div>
    </div>
  </section>
</main>

<input type="file" id="fileInput" accept=".json" style="display:none">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- LiteGraph -->
<link rel="stylesheet" href="css/external/litegraph.css">

<!-- Simplex Noise -->
<script src="js/external/random.js"></script>
<script src="js/external/simplex.js"></script>
<script src="js/external/perlin.js"></script>
<script src="js/external/litegraph.js"></script>
<script src="js/utils.js"></script>
<script src="js/nodes/shared.js"></script>
<script src="js/nodes/combine.js"></script>
<script src="js/nodes/expression.js"></script>
<script src="js/nodes/filter.js"></script>
<script src="js/nodes/generator.js"></script>
<script src="js/nodes/math.js"></script>
<script src="js/nodes/transform.js"></script>
<script src="js/nodes/utility.js"></script>
<script src="js/examples.js"></script>
<script src="js/graphManager.js"></script>
<script src="js/main.js"></script>
</body>
</html>
