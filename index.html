<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoiseLab</title>
<link rel="icon" type="image/png" href="/img/icon.png">
<style>
  body { margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }

  /* Top title bar */
  #titlebar {
    height: 50px;
    background: #333;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 15px;
    font-size: 1.2em;
    flex-shrink: 0;
    user-select: none;
  }
  #titlebar span { margin-left: 10px; }
  #titlebar img { height: 30px; }

  /* Main content area */
  #content {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* Left panel (graph) */
  #graph-container {
    flex: 1;
    background: #111;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Right panel (final canvas) */
  #canvas-container {
    width: 400px;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-left: 2px solid #444;
  }

  /* LiteGraph canvas fills left panel */
  #graph { width: 100%; height: 100%; display: block; }

  /* Final noise canvas */
  #noiseCanvas { border: 1px solid #555; }


    /* Checkbox*/
    .checkbox-container { margin-left: auto;}

    .checkbox-container {
        display: block;
        position: relative;
        padding-left: 45px;
        cursor: pointer;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    /* Hide the browser's default checkbox */
    .checkbox-container input {
        position: absolute;
        opacity: 0;
        cursor: pointer;
        height: 0;
        width: 0;
    }

    /* Create a custom checkbox */
    .checkmark {
        position: absolute;
        top: 0;
        left: 0;
        height: 20px;
        width: 20px;
        background-color: #eee;
    }

    /* On mouse-over, add a grey background color */
    .checkbox-container:hover input ~ .checkmark {
        background-color: #ccc;
    }

    /* When the checkbox is checked, add a blue background */
    .checkbox-container input:checked ~ .checkmark {
        background-color: #B16F8F;
    }

    /* Create the checkmark/indicator (hidden when not checked) */
    .checkmark:after {
        content: "";
        position: absolute;
        display: none;
    }

    /* Show the checkmark when checked */
    .checkbox-container input:checked ~ .checkmark:after {
        display: block;
    }

    /* Style the checkmark/indicator */
    .checkbox-container .checkmark:after {
        left: 6px;
        top: 2px;
        width: 5px;
        height: 10px;
        border: solid white;
        border-width: 0 3px 3px 0;
        -webkit-transform: rotate(45deg);
        -ms-transform: rotate(45deg);
        transform: rotate(45deg);
    }
</style>
</head>
<body>

<div id="titlebar">
  <img src="img/icon.png">
  <span>NoiseLab</span>

  <label class="checkbox-container">Terrain mode
    <input type="checkbox" checked="checked" id="terrain-mode">
    <span class="checkmark"></span>
  </label>
</div>

<div id="content">
  <div id="graph-container">
    <canvas id="graph"></canvas>
  </div>
  <div id="canvas-container">
    <canvas id="noiseCanvas" width="256" height="256"></canvas>
  </div>
</div>

<!-- LiteGraph -->
<script src="https://unpkg.com/litegraph.js/build/litegraph.js"></script>
<link rel="stylesheet" href="https://unpkg.com/litegraph.js/css/litegraph.css">

<!-- Simplex Noise -->
<script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.js"></script>

<script>
// --- Canvas setup ---
const canvas = document.getElementById("noiseCanvas");
const ctx = canvas.getContext("2d");
let WIDTH = canvas.width;
let HEIGHT = canvas.height;

const PREVIEW_W = 128;
const PREVIEW_H = 128;
const PREVIEW_PADDING = 10;

LiteGraph.clearRegisteredTypes()

// --- Node evaluation ---
let activeNode = null;

const terrainModeCheck = document.getElementById("terrain-mode")
terrainModeCheck.onchange = () => { renderNode(graph.activeNode) }

// --- Graph setup ---
const graphCanvasEl = document.getElementById("graph");
const graph = new LGraph();
const graphCanvas = new LGraphCanvas(graphCanvasEl, graph);
graph.start();

function heightToRGB(height) {

    height = (height / 255)

    // Define color stops for terrain
    const gradient = [
        { h: 0.0, color: [0, 0, 200] },        // Deep water
        { h: 0.1, color: [0, 100, 255] },      // Shallow water
        { h: 0.2, color: [238, 214, 175] },    // Beach
        { h: 0.4, color: [34, 139, 34] },      // Green fields
        { h: 0.6, color: [0, 100, 0] },        // Darker green hills
        { h: 0.8, color: [139, 69, 19] },      // Brown mountains
        { h: 1.5, color: [255, 250, 250] }     // Snow
    ];

    // Find the segment that contains the current height
    let lower = gradient[0];
    let upper = gradient[gradient.length - 1];

    for (let i = 0; i < gradient.length - 1; i++) {
        if (height >= gradient[i].h && height <= gradient[i + 1].h) {
            lower = gradient[i];
            upper = gradient[i + 1];
            break;
        }
    }

    // Interpolation factor
    let t = (height - lower.h) / (upper.h - lower.h);

    // Linear interpolation between colors
    const r = Math.round(lower.color[0] + (upper.color[0] - lower.color[0]) * t);
    const g = Math.round(lower.color[1] + (upper.color[1] - lower.color[1]) * t);
    const b = Math.round(lower.color[2] + (upper.color[2] - lower.color[2]) * t);

    return {
        r: Math.round(r),
        g: Math.round(g),
        b: Math.round(b),
    }
}

// --- Helper: render 2D noise array to canvas ---
function renderNoise(noiseArray) {
    const imgData = ctx.createImageData(WIDTH, HEIGHT);
    const isTerrainMode = terrainModeCheck.checked;
    for (let i = 0; i < WIDTH * HEIGHT; i++) {
        const v = Math.floor((noiseArray[i] + 1) * 127.5);

        const col = isTerrainMode ? heightToRGB(v) : null;
        imgData.data[i*4+0] = col?.r || v;
        imgData.data[i*4+1] = col?.g || v;
        imgData.data[i*4+2] = col?.b || v;
        imgData.data[i*4+3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
}

// --- Responsive resizing ---
function resizeGraph() {
    const rect = graphCanvasEl.parentElement.getBoundingClientRect();
    graphCanvasEl.width = rect.width;
    graphCanvasEl.height = rect.height;
    graphCanvas.resize();
}
window.addEventListener("resize", resizeGraph);
resizeGraph();

// --- Base node with preview canvas ---
class NoiseNode extends LGraphNode {
    constructor() {
        super();
        this.previewCanvas = document.createElement("canvas");
        this.previewCanvas.width = WIDTH;
        this.previewCanvas.height = HEIGHT;
        this.previewCtx = this.previewCanvas.getContext("2d");
    }

    onConnectionsChange()
    {
        this.onExecute();
        this.drawPreview(this.getOutputData(0))
    }

    onPropertyChanged()
    { 
        this.onExecute();
        this.drawPreview(this.getOutputData(0))
        renderNode(this)
    }

    drawPreview(noiseArray) {
        if (!noiseArray) return;
        const w = this.previewCanvas.width;
        const h = this.previewCanvas.height;
        const imgData = this.previewCtx.createImageData(w,h);
        const isTerrainMode = terrainModeCheck.checked;
        for (let y=0;y<h;y++){
            for (let x=0;x<w;x++){
                const nx = Math.floor(x/WIDTH*WIDTH);
                const ny = Math.floor(y/HEIGHT*HEIGHT);
                const v = Math.floor((noiseArray[ny*WIDTH+nx]+1)*127.5);
                const idx = (y*w+x)*4;
                const col = isTerrainMode ? heightToRGB(v) : null;

                imgData.data[idx+0] = col?.r || v;
                imgData.data[idx+1] = col?.g || v;
                imgData.data[idx+2] = col?.b || v;
                imgData.data[idx+3] = 255;
            }
        }
        this.previewCtx.putImageData(imgData,0,0);
    }

    onDrawBackground(ctx) {
        if (this.flags.collapsed)
            return;

        const h = this.size[1];
        const w = this.size[0];
        
        if (this.previewCanvas) {
            ctx.drawImage(this.previewCanvas, 
            0, 0, this.previewCanvas.width, this.previewCanvas.height, 
            (w - PREVIEW_W) * 0.5, h - PREVIEW_H - PREVIEW_PADDING * 0.5, PREVIEW_W, PREVIEW_H);
        }
    }
}

// --- Perlin Node ---
class PerlinNode extends NoiseNode {
    constructor() {
        super();
        this.addOutput("noise","array");
        this.properties = { frequency: 5, octaves: 1, amplitude: 1, offset: 0 };
        this.addWidget("slider","Frequency",0.5,{min:0,max:20,property:"frequency"});
        this.addWidget("slider","Octaves",1,{min:0,max:5,step:1,precision:0,property:"octaves"});
        this.addWidget("slider","Amplitude",1,{min:0,max:5,property:"amplitude"});
        this.addWidget("slider","Offset",1,{min:0,max:5,property:"offset"});
        this.simplex = new SimplexNoise();
        this.title="Perlin";
        this.size[1] += PREVIEW_H + PREVIEW_PADDING;
    }

    onExecute() {
        const freq = this.properties.frequency;
        const octaves = this.properties.octaves;
        const offset = this.properties.offset;
        let noiseArray = new Array(WIDTH*HEIGHT).fill(0);

        for(let y=0;y<HEIGHT;y++){
            for(let x=0;x<WIDTH;x++){
                let nx=x/WIDTH;
                let ny=y/HEIGHT;
                let val=0, amp=this.properties.amplitude, freqMult=1;
                for(let o=0;o<octaves;o++){
                    val += this.simplex.noise2D(nx*freq*freqMult + offset, ny*freq*freqMult + offset)*amp;
                    amp*=0.5;
                    freqMult*=2;
                }
                noiseArray[y*WIDTH+x] = val;
            }
        }
        this.setOutputData(0,noiseArray);
        this.drawPreview(noiseArray);
    }
}
LiteGraph.registerNodeType("Generator/Perlin",PerlinNode);


// --- Binary Function Nodes ---
function initBinaryOp(node, name)
{
    node.addInput("A","array");
    node.addInput("B","array");
    node.addOutput("out","array");
    node.title = name;
    node.size[1] += PREVIEW_H + PREVIEW_PADDING;
}

function executeBinaryOp(node, func)
{
    const a=node.getInputData(0) || new Array(WIDTH*HEIGHT).fill(0);
    const b=node.getInputData(1) || new Array(WIDTH*HEIGHT).fill(0);
    const out=a.map((v,i)=>func(v,b[i]));
    node.setOutputData(0,out);
    node.drawPreview(out);
}

class AddNode extends NoiseNode {
    constructor(){
        super();
        initBinaryOp(this, "Add")
    }
    onExecute(){
        executeBinaryOp(this, (a,b)=>a+b)
    }
}
LiteGraph.registerNodeType(`Function/Add`, AddNode);

class MultiplyNode extends NoiseNode {
    constructor(){
        super();
        initBinaryOp(this, "Multiply")
    }
    onExecute(){
        executeBinaryOp(this, (a,b)=>a*b)
    }
}
LiteGraph.registerNodeType(`Function/Multiply`, MultiplyNode);

class SubtractNode extends NoiseNode {
    constructor(){
        super();
        initBinaryOp(this, "Subtract")
    }
    onExecute(){
        executeBinaryOp(this, (a,b)=>a-b)
    }
}
LiteGraph.registerNodeType(`Function/Subtract`, SubtractNode);

class MaxNode extends NoiseNode {
    constructor(){
        super();
        initBinaryOp(this, "Max")
    }
    onExecute(){
        executeBinaryOp(this, (a,b)=>Math.max(a,b))
    }
}
LiteGraph.registerNodeType(`Function/Max`, MaxNode);

class MinNode extends NoiseNode {
    constructor(){
        super();
        initBinaryOp(this, "Min")
    }
    onExecute(){
        executeBinaryOp(this, (a,b)=>Math.min(a,b))
    }
}
LiteGraph.registerNodeType(`Function/Min`, MinNode);


// --- Clamp Node ---
class ClampNode extends NoiseNode {
    constructor(){
        super();
        this.addInput("value","array");
        this.addOutput("out","array");
        this.properties={min:-1, max:1};
        this.addWidget("slider","Min", 0.5,{min:-5,max: 5, property:"min"});
        this.addWidget("slider","Max", 0.5,{min:-5,max: 5, property:"max"});
        this.title="Clamp";
        this.size[1] += PREVIEW_H + PREVIEW_PADDING;
    }
    
    onExecute(){
        const input=this.getInputData(0) || new Array(WIDTH*HEIGHT).fill(0);
        const min=this.properties.min;
        const max=this.properties.max;
        const out=input.map(v=>Math.max(min,Math.min(max,v)));
        this.setOutputData(0, out);
        this.drawPreview(out);
    }
}
LiteGraph.registerNodeType("Function/Clamp",ClampNode);

// --- Click node to preview full canvas ---
function renderNode(node){
    // execute all nodes
    graph._nodes_in_order.forEach(n => n.onExecute());

    // render clicked node output
    const output = node?.getOutputData(0);
    if(output) renderNoise(output);
}

graphCanvas.onNodeSelected = node=>{
    activeNode=node;
    renderNode(activeNode);
};

// --- Example nodes ---
const p1=new PerlinNode();
p1.pos=[10,10];
p1.properties.frequency = 6.2;
p1.properties.octaves = 3;
graph.add(p1);

const p2=new PerlinNode();
p2.pos=[10,350];
p2.properties.frequency=1.3;
p2.properties.amplitude=1.88;
p2.properties.offset=1.72;
graph.add(p2);

const addNode=new (LiteGraph.getNodeType("Function/Add"))();
addNode.pos=[300,180];
graph.add(addNode);

const clampNode=new ClampNode();
clampNode.pos=[500,180];
graph.add(clampNode);

// connect nodes
p1.connect(0, addNode, 0)
p2.connect(0, addNode, 1)

addNode.connect(0, clampNode, 0)

renderNode(clampNode)

</script>
</body>
</html>
